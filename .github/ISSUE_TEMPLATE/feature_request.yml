name: Feature request
description: Suggest an idea for FocusFlow
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Tell us about the distraction or situation, not only the solution you have in mind.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would you like FocusFlow to do?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What have you tried so far?
      description: Other FocusFlow settings, other apps, or workarounds.
  - type: checkboxes
    id: help
    attributes:
      label: Can you help?
      options:
        - label: I'm willing to help build or test this
